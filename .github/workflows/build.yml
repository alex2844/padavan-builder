name: Build firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    env:
      BUILDER_DEPENDENCIES: false
      BUILDER_CLEANUP: false
      BUILDER_RESET: false
      # Use the upstream Padavan-ng repository for stable CI builds:
      PADAVAN_REPO: https://gitlab.com/hadzhioglu/padavan-ng.git
      PADAVAN_BRANCH: master
      PADAVAN_CONFIG: https://raw.githubusercontent.com/devmujahidul/padavan-builder/devmujahidul-debug-firmware-build-failures/build.config

    steps:
    - uses: actions/checkout@v4

    - name: Create post_build script
      run: |
        cat > post_build.sh <<'EOF'
        #!/bin/sh
        # Append CONFIG_* and FW_* environment variables to $GITHUB_ENV in a POSIX-safe way
        for name in $(env | awk -F= '/^(CONFIG_|FW_)/ {print $1}'); do
          val=$(printenv "$name")
          printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
        done
        EOF
        chmod +x post_build.sh

    - name: Build firmware
      run: ./build.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CONFIG_VENDOR }}_${{ env.FW_NAME }}
        retention-days: 7
        path: |
          ${{ env.FW_FILE_NAME }}
          build.conf
          build.config
